name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y cmake ninja-build openjdk-21-jdk p7zip-full curl glslang-tools openssl

      - name: Setup Rust
        run: |
          rustup default 1.92.0
          cargo install cargo-ndk
          rustup target add armv7-linux-androideabi
          rustup target add i686-linux-android
          rustup target add aarch64-linux-android
          rustup target add x86_64-linux-android

      - name: Download Android SDK
        run: |
          mkdir -p ~/Android/Sdk/ndk ~/Android/Sdk/build-tools ~/Android/Sdk/cmdline-tools
          
          cd ~/Android/Sdk/ndk
          wget --quiet https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
          unzip -q android-ndk-r25c-linux.zip
          rm android-ndk-r25c-linux.zip
          
          cd ~/Android/Sdk/build-tools
          wget --quiet https://dl.google.com/android/repository/build-tools_r30.0.3-linux.zip
          unzip -q build-tools_r30.0.3-linux.zip
          rm build-tools_r30.0.3-linux.zip
          mv android-11 30.0.3
          
          cd ~/Android/Sdk/cmdline-tools
          wget --quiet https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          rm commandlinetools-linux-11076708_latest.zip
          mv cmdline-tools latest
          
          yes | latest/bin/sdkmanager --licenses

      - name: Build APK
        env:
          ANDROID_HOME: /home/runner/Android/Sdk
        run: |
          chmod +x scripts/android/cmake_android.sh
          ./scripts/android/cmake_android.sh arm64 sexus111 Release build_android build_android

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: sexus111-android
          path: build_android/*.apk
